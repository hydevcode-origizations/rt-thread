  #流程：
  #1.获取当前已发布版本的时间
  #2.统计当前到上一个版本的pr做成描述
  #3.打包仓库
  #4.发布小版本
name: Auto Release with PR Notes

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整提交历史

    - name: Get Previous Tag
      id: prev_tag
      run: |
        # 获取上一个发布的标签（排除预发布标签）
        PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" HEAD^ 2>/dev/null || echo "")
        echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

    - name: Generate PR List
      id: pr_list
      if: ${{ steps.prev_tag.outputs.prev_tag != '' }}
      run: |
        # 获取两个标签之间的 PR 列表（使用 GitHub CLI）
        gh pr list \
          --base main \
          --state merged \
          --search "merged:>${{ steps.prev_tag.outputs.prev_tag }}" \
          --json number,title,author,url \
          --jq 'map("- [#\(.number)](\(.url)) \(.title) @\(.author.login)") | join("\n")' \
          > pr_list.txt

        # 将 PR 列表保存为变量
        PR_NOTES=$(cat pr_list.txt)
        echo "pr_notes=${PR_NOTES}" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release Notes
      run: |
        # 生成版本描述文件
        RELEASE_NOTES="## ${{ env.NEW_VERSION }} ($(date -I))\n\n"
        if [ -n "${{ steps.pr_list.outputs.pr_notes }}" ]; then
          RELEASE_NOTES+="### Merged PRs since ${{ steps.prev_tag.outputs.prev_tag }}:\n"
          RELEASE_NOTES+="${{ steps.pr_list.outputs.pr_notes }}\n"
        else
          RELEASE_NOTES+="No new PRs since last release.\n"
        fi

        echo -e "$RELEASE_NOTES" > release_notes.md

    - name: Publish Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.NEW_VERSION }}
        name: ${{ env.NEW_VERSION }}
        body_file: release_notes.md
      env:
        NEW_VERSION: v1.2.3  # 替换为你的版本生成逻辑
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}